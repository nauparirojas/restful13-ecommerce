components:
  schemas:
    Carrito:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        usuario:
          type: integer
          readOnly: true
        activo:
          type: boolean
        cupon:
          type: integer
          nullable: true
        cupon_codigo:
          type: string
          readOnly: true
        items:
          type: array
          items:
            $ref: '#/components/schemas/ItemCarrito'
          readOnly: true
        cantidad_items:
          type: integer
          readOnly: true
        subtotal:
          type: string
          readOnly: true
        impuestos:
          type: string
          readOnly: true
        total:
          type: string
          readOnly: true
        total_con_descuento:
          type: string
          readOnly: true
        actualizado_en:
          type: string
          format: date-time
          readOnly: true
      required:
      - actualizado_en
      - cantidad_items
      - cupon_codigo
      - id
      - impuestos
      - items
      - subtotal
      - total
      - total_con_descuento
      - usuario
    Categoria:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        nombre:
          type: string
          maxLength: 120
        descripcion:
          type: string
        imagen:
          oneOf:
          - type: string
            format: uri
            maxLength: 200
          - type: string
            maxLength: 0
      required:
      - id
      - nombre
    EstadoEnum:
      enum:
      - pendiente
      - pagada
      - enviada
      - entregada
      - cancelada
      type: string
      description: |-
        * `pendiente` - Pendiente
        * `pagada` - Pagada
        * `enviada` - Enviada
        * `entregada` - Entregada
        * `cancelada` - Cancelada
    ItemCarrito:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        producto:
          type: integer
        producto_sku:
          type: string
          readOnly: true
        producto_nombre:
          type: string
          readOnly: true
        precio_unitario:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          readOnly: true
        cantidad:
          type: integer
          maximum: 9223372036854775807
          minimum: 1
          format: int64
        subtotal_item:
          type: string
          readOnly: true
      required:
      - id
      - precio_unitario
      - producto
      - producto_nombre
      - producto_sku
      - subtotal_item
    Orden:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        usuario:
          type: integer
          readOnly: true
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrdenItemSnapshot'
          readOnly: true
        direccion_envio:
          type: string
        metodo_pago:
          type: string
          maxLength: 60
        estado:
          $ref: '#/components/schemas/EstadoEnum'
        total:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          readOnly: true
        numero_seguimiento:
          type: string
          readOnly: true
          nullable: true
        tiempo_estimado_entrega:
          type: object
          additionalProperties: {}
          readOnly: true
        fecha_creacion:
          type: string
          format: date-time
          readOnly: true
      required:
      - direccion_envio
      - fecha_creacion
      - id
      - items
      - metodo_pago
      - numero_seguimiento
      - tiempo_estimado_entrega
      - total
      - usuario
    OrdenItemSnapshot:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        producto:
          type: integer
          readOnly: true
        producto_sku:
          type: string
          readOnly: true
        producto_nombre:
          type: string
          readOnly: true
        cantidad:
          type: integer
          readOnly: true
        precio_unitario:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          readOnly: true
        subtotal:
          type: string
          readOnly: true
      required:
      - cantidad
      - id
      - precio_unitario
      - producto
      - producto_nombre
      - producto_sku
      - subtotal
    PaginatedCarritoList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
